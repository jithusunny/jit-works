<script>
// The atlas first, while the rest of the page arrives: the cover shows from it (loadSmall). Fetched
// here rather than preloaded, because Chrome sometimes never hands a preloaded body to fetch().
// Fresh HTML has just checked book availability. The versioned atlas never changes, so reuse
// downloaded bytes without a second round trip. Ordinary direct file requests still revalidate.
// Bound network silence, not total transfer time: a large image on a slow connection must be
// allowed to finish while bytes keep arriving. AbortController also works on older browsers.
async function fetchBlob(url, options = {}, byteLimit = () => Infinity) {
  const controller = new AbortController(), abort = () => controller.abort();
  let timer;
  const progress = () => { clearTimeout(timer); timer = setTimeout(abort, 15000); };
  const signal = options.signal;
  if (signal?.aborted) abort(); else signal?.addEventListener('abort', abort, { once: true });
  progress();
  try {
    const r = await fetch(url, { ...options, signal: controller.signal });
    if (!r.ok) { throw new Error(r.status); }
    // A speculative file may no longer fit. Check headers and streamed bytes; promotion to
    // foreground removes the limit without restarting a useful transfer.
    if (Number(r.headers.get('content-length')) > byteLimit()) { abort(); return null; }
    const reader = r.body.getReader(), chunks = []; let size = 0; progress();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      size += value.byteLength;
      if (size > byteLimit()) { abort(); return null; }
      chunks.push(value); progress();
    }
    return new Blob(chunks, { type: r.headers.get('content-type') || '' });
  } finally { clearTimeout(timer); signal?.removeEventListener('abort', abort); }
}
const atlasController = new AbortController();
window.atlasFirst = fetchBlob("book/atlas.jpg", { cache: 'force-cache', signal: atlasController.signal });
// The document may still be arriving when this request fails.
window.atlasFirst.catch(() => {});
// This embedded menu is served from the bundled portfolio assets.
</script>

<script>
// Fullscreen is independent of WebGL, so plain-page readers get the same control.
(() => {
  const button = document.getElementById('fullscreenBtn'), icon = document.getElementById('fullscreenIcon');
  const expand = icon.getAttribute('d');
  let mode = '', pending = false, restoreEmbed = null;
  const canExpandFrame = !!window.frameElement;
  button.parentElement.hidden = !document.fullscreenEnabled && !canExpandFrame;
  document.body.classList.toggle('has-fullscreen', !button.parentElement.hidden);
  const update = (next) => {
    mode = next;
    button.setAttribute('aria-label', mode ? 'Exit full screen' : 'Full screen');
    button.title = mode ? 'Exit full screen' : 'Full screen';
    icon.setAttribute('d', mode ? 'M6 6l12 12M18 6L6 18' : expand);
  };
  const restore = () => {
    // Browser Escape can also leave native fullscreen while a page is zoomed.
    if (!document.getElementById('zoom').hidden) closeZoom();
    restoreEmbed?.(); restoreEmbed = null;
    update(''); button.focus({ preventScroll: true });
  };
  const viewport = () => {
    // Our same-origin homepage can expand its existing iframe without navigating or reparenting it.
    // Reparenting an iframe reloads its document and loses the reader's place.
    const frame = window.frameElement;
    if (!frame) return; // A denied native request leaves the focused control available to retry.
    const doc = frame.ownerDocument, win = doc.defaultView, x = win.scrollX, y = win.scrollY;
    const saved = [frame, doc.body, doc.documentElement].map(el => [el, el.getAttribute('style')]);
    const popover = frame.getAttribute('popover');
    const topLayer = typeof frame.showPopover === 'function';
    if (topLayer) { frame.setAttribute('popover', 'manual'); frame.showPopover(); }
    const inert = [];
    for (let node = frame; node.parentElement; node = node.parentElement) {
      for (const sibling of node.parentElement.children) if (sibling !== node && sibling instanceof win.HTMLElement) {
        inert.push([sibling, sibling.inert]); sibling.inert = true;
      }
      if (node.parentElement === doc.body) break;
    }
    Object.assign(doc.body.style, { position: 'fixed', top: `${-y}px`, left: `${-x}px`, width: '100%', overflow: 'hidden' });
    doc.documentElement.style.overflow = 'hidden';
    frame.style.height = '100vh'; // Older browsers ignore dvh and retain this fallback.
    Object.assign(frame.style, { position: 'fixed', inset: '0', width: '100vw', height: '100dvh', minHeight: '0', maxHeight: 'none', borderRadius: '0', zIndex: '2147483647', margin: '0', padding: '0', border: '0', maxWidth: 'none' });
    restoreEmbed = () => {
      if (topLayer) { frame.hidePopover(); popover === null ? frame.removeAttribute('popover') : frame.setAttribute('popover', popover); }
      for (const [el, value] of saved) value === null ? el.removeAttribute('style') : el.setAttribute('style', value);
      for (const [el, value] of inert) el.inert = value;
      win.scrollTo({ left: x, top: y, behavior: 'instant' });
    };
    update('viewport'); button.focus({ preventScroll: true });
  };
  const exit = async () => {
    if (pending) return;
    if (mode === 'native' && document.fullscreenElement) {
      pending = true;
      try { await document.exitFullscreen(); } catch { /* Keep the working close control for another attempt. */ }
      finally { pending = false; }
    } else restore();
  };
  button.onclick = async () => {
    if (pending) return;
    if (mode) { await exit(); return; }
    pending = true;
    try {
      if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
        try { await document.documentElement.requestFullscreen(); return; }
        catch { /* iPhone and denied requests still get a full browser-viewport view. */ }
      }
      viewport();
    } finally { pending = false; }
  };
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) { update('native'); button.focus({ preventScroll: true }); }
    else if (mode === 'native') restore();
  });
  addEventListener('keydown', e => {
    // Zoom and page-number entry keep their own Escape behavior first.
    if (e.key === 'Escape' && !e.defaultPrevented && mode && document.getElementById('zoom').hidden && document.getElementById('jump').hidden) {
      e.preventDefault(); void exit();
    }
    if (e.key === 'Tab' && !e.defaultPrevented && mode) {
      const zoom = document.getElementById('zoom'), scope = document.getElementById('controls').inert ? zoom : document;
      const focusable = [...scope.querySelectorAll('button, a[href], input, select, textarea, summary, [tabindex]')].filter(el => (scope === zoom || !zoom.contains(el)) && !el.disabled && el.tabIndex >= 0 && !el.closest('[inert]') && el.getClientRects().length && getComputedStyle(el).visibility === 'visible');
      const first = focusable[0], last = focusable.at(-1);
      if (e.shiftKey && (document.activeElement === first || !focusable.includes(document.activeElement))) { e.preventDefault(); last?.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !focusable.includes(document.activeElement))) { e.preventDefault(); first?.focus(); }
    }
  });
  addEventListener('pagehide', () => { restoreEmbed?.(); restoreEmbed = null; update(''); });
})();
</script>

<!-- ======================= shaders ======================= -->
<script id="common" type="x-shader">
const vec3 PAPER = vec3(.957, .945, .925), TABLE = vec3(.105882, .203922, .156863);   // TABLE matches the page background
uniform vec2 uSize;     // page width, height (book px)
uniform float uOpen;    // how open the book is: 0 closed on a cover, 1 lying open (the crease shows)
uniform float uLeftW;   // how much of the left page shows: all of it, or one page at a time a sliver
</script>

<script id="pagefs" type="x-shader">
// A page's picture. `at` places it in its texture: the whole of a page's own picture, or its cell of the
// atlas. `fit` places the picture on the leaf: all of it, or, for a page of another shape, centred
// with paper round it. has: 0 no page, 1 a picture, 2 nothing yet (plain paper, only for a moment at start).
// Always called for every pixel, never inside a branch that differs between neighbouring pixels: the
// card works out how sharp a copy to read from neighbouring pixels, and inside such a branch some cards
// read nonsense there (a blurred, brownish copy, in dashes along the page edges). The sharpness is also
// given explicitly, from the unclamped position, so the page edge reads the same copy as the page.
// Flat and turning pages share the same bias: text must not change sharpness as a page lands.
vec4 pg(sampler2D t, float has, vec4 at, vec4 fit, vec2 uv) {
  vec2 q = (uv - fit.xy) / fit.zw, dx = dFdx(q) * at.zw * .76, dy = dFdy(q) * at.zw * .76;
  vec4 c = textureGrad(t, at.xy + clamp(q, .002, .998) * at.zw, dx, dy);
  vec2 e = min(q, 1. - q) / max(fwidth(q), 1e-5);              // how far inside the picture, in screen pixels
  float inside = fit.z * fit.w > .9999 ? 1. : clamp(min(e.x, e.y) + .5, 0., 1.);
  c = mix(vec4(PAPER, 1.), c, inside);
  return has < .5 ? vec4(0.) : has > 1.5 ? vec4(PAPER, 1.) : c;
}
// Where a page curves down into the binding it catches less light: a narrow dark crease, a wider
// soft shade, then a faint lift of light where the paper starts to curve.
// A closed cover has the same soft curve round the spine, without the narrow crease between two open
// pages: uOpen blends from the one to the other.
float binding(float x) {
  float d = abs(x) / uSize.x;
  return 1. - (.22 * uOpen * exp(-d / .012) + .09 * exp(-d / .07) + .05 * (1. - uOpen) * exp(-d / .03)
             - .025 * exp(-pow((d - .16) / .07, 2.)));
}
</script>

<script id="bgfs" type="x-shader">
uniform vec2 uRes;
uniform vec3 uView;     // book x, y at the canvas's top left; book px per device px
uniform sampler2D tL, tR, tShadow;
uniform vec2 uHas;      // left page, right page
uniform vec4 uAtL, uAtR, uFitL, uFitR;
uniform vec2 uStack;    // thickness of the page block showing on the left and on the right (book px)
uniform float uTurn;
out vec4 o;
float box(vec2 p, vec2 lo, vec2 hi) { vec2 d = max(lo - p, p - hi); return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
void main() {
  float W = uSize.x, H = uSize.y, px = uView.z;
  vec2 Q = uView.xy + vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) * px;
  bool hasL = uHas.x > .5, hasR = uHas.y > .5;
  vec2 lo = vec2(hasL ? -min(uLeftW, W) : 0., 0.), hi = vec2(hasR ? W : 0., H);
  vec2 blo = lo - vec2(hasL ? uStack.x : 0., 0.), bhi = hi + vec2(hasR ? uStack.y : 0., max(uStack.x, uStack.y));
  float shade = uTurn > .5 ? texture(tShadow, gl_FragCoord.xy / uRes).r : 0.;
  // On the table: a wide soft shadow, a tight contact shadow, and the lifted page's shadow.
  float a = .16 * (1. - smoothstep(-.02 * H, .05 * H, box(Q - vec2(.008 * W, .016 * H), blo, bhi)))
          + .09 * (1. - smoothstep(0., .014 * H, box(Q - vec2(0., .003 * H), blo, bhi)));   // a soft contact shade, not an outline
  vec3 c = TABLE * (1. - clamp(a + .45 * shade, 0., 1.));
  // The edges of the page block: one smooth tone, a little darker towards the table. (No sheet lines:
  // finer than a screen pixel, they break up into dashes.)
  float e = box(Q, lo, hi), deep = max(max(uStack.x, uStack.y), 1.);
  c = mix(c, PAPER * mix(.95, .86, clamp(e / deep, 0., 1.)), clamp(.5 - box(Q, blo, bhi) / px, 0., 1.));
  // The pages.
  float kp = clamp(.5 - e / px, 0., 1.);
  vec4 pL = pg(tL, uHas.x, uAtL, uFitL, vec2((Q.x + W) / W, Q.y / H)), pR = pg(tR, uHas.y, uAtR, uFitR, Q / uSize);   // flat: crisp text
  if (kp > 0.) {
    vec4 p = Q.x < 0. ? pL : pR;
    float crease = binding(Q.x);
    c = mix(c, p.rgb * crease * (1. - .55 * shade), kp * p.a);
  }
  o = vec4(c, 1.);
}
</script>

<script id="sheetvs" type="x-shader">
// The turning page is drawn as strips laid along its bend: dense across the curve, one each for the
// flat and the straight parts. Along the bend the page is straight, so this follows the curve exactly
// at any angle; the strips cover the page's whole extent and are trimmed to it in the fragment shader.
in vec2 aUV;            // x: position along its part (0 to 1); y: which side of the page's extent
in float aPart;         // 0 still flat, 1 the curve, 2 straight beyond it
uniform vec2 uA, uDir, uCam, uS, uV;    // bend line point and direction; extent along and across it
uniform float uR, uAlpha, uZc, uMirror;

$('count').onclick = () => { clearEndFeedback(); $('count').hidden = true; jump.hidden = false; jumpTo.value = here(); jumpTo.focus(); jumpTo.select(); };
const closeJump = () => { jump.hidden = true; $('count').hidden = false; };
const goToEnteredPage = () => {
  audio.unlock();
  const n = parseInt(jumpTo.value, 10);
  closeJump();
  if (n >= 1 && n <= N) turnTo(spread ? Math.floor(n / 2) : n);
};
jump.onsubmit = (e) => { e.preventDefault(); goToEnteredPage(); };
jumpTo.onblur = () => setTimeout(closeJump, 0);
jumpTo.onkeydown = (e) => {
  if (e.key === 'Enter') { e.preventDefault(); goToEnteredPage(); }
  if (e.key === 'Escape') { e.preventDefault(); closeJump(); $('count').focus(); }
};
addEventListener('keydown', (e) => {
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey || e.target === jumpTo) return;   // browser shortcuts, and typing a page number
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;   // a focused button handles itself
  const key = { ArrowRight: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, PageUp: -1 }[e.key];
  if (key) { e.preventDefault(); audio.unlock(); turnBy(key); }
  if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); audio.unlock(); turnTo(e.key === 'Home' ? first() : last()); }
});
canvas.addEventListener('wheel', (e) => { if (e.ctrlKey) { e.preventDefault(); openZoom({ x: e.clientX, y: e.clientY }); } }, { passive: false });

// ======================= zoom: the pages in view at full resolution =======================
// CSS dimensions describe the fitted view, not the full-resolution image's thousands of pixels.
// Keep the entry pages while rotating, so the page under the reader's finger cannot disappear.
const Z = { el: $('zoom'), content: $('zc'), active: false, session: 0, s: 1, x: 0, y: 0,
  w: 0, h: 0, ratio: 1, area: null, pts: new Map(), last: null, tapAt: 0, tapPoint: null };
function clearZoomPointers() {
  for (const id of Z.pts.keys()) if (Z.el.hasPointerCapture(id)) Z.el.releasePointerCapture(id);
  Z.pts.clear(); Z.last = null; Z.tapAt = 0;
}
function clearBookPointers() {
  drag = null;
  for (const id of fingers.keys()) if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
  fingers.clear();
}
function zoomArea() {
  const box = Z.el.getBoundingClientRect(), safe = getComputedStyle($('safe'));
  const [st, sr, sb, sl] = ['Top', 'Right', 'Bottom', 'Left'].map(k => parseFloat(safe['padding' + k]) || 0);
  // Both candidates use intrinsic control sizes, independent of the currently selected placement.
  const close = Z.el.querySelector('.close'), bar = Z.el.querySelector('.bar');
  const top = st + 12 + close.offsetHeight + 8, bottom = box.height - sb - 10 - bar.offsetHeight - 8;
  const below = { x: sl + 12, y: top, w: Math.max(1, box.width - sl - sr - 24), h: Math.max(1, bottom - top) };
  const gutter = 12 + Math.max(close.offsetWidth, bar.offsetWidth) + 8;
  const beside = { x: sl + gutter, y: st + 8, w: Math.max(1, box.width - sl - sr - 2 * gutter), h: Math.max(1, box.height - st - sb - 16) };
  const fit = a => Math.min(a.h, a.w / Z.ratio);
  const side = bottom > top && fit(beside) > fit(below);
  Z.el.classList.toggle('side', side);
  return side ? beside : below;
}
function zoomSync() {
  // A drag or rotation can interrupt a button's CSS transition. Start from what is on screen.
  const m = new DOMMatrixReadOnly(getComputedStyle(Z.content).transform);
  Z.s = m.a; Z.x = m.e; Z.y = m.f;
}
function zoomLayout(reset = false) {
  if (!Z.active || !Z.el.clientWidth || !Z.el.clientHeight) return;
  const area = zoomArea(); reset = reset || !Z.area;
  if (!reset && Z.area && Object.keys(area).every(k => area[k] === Z.area[k])) return;
  if (!reset) zoomSync();
  const u = reset ? .5 : (Z.area.x + Z.area.w / 2 - Z.x) / (Z.w * Z.s);
  const v = reset ? .5 : (Z.area.y + Z.area.h / 2 - Z.y) / (Z.h * Z.s);
  clearZoomPointers(); Z.area = area;
  Z.h = Math.min(area.h, area.w / Z.ratio); Z.w = Z.h * Z.ratio;
  if (reset) Z.s = 1;
  Object.assign(Z.content.style, { width: Z.w + 'px', height: Z.h + 'px' });
  Z.x = area.x + area.w / 2 - u * Z.w * Z.s;
  Z.y = area.y + area.h / 2 - v * Z.h * Z.s; zoomApply();
}
function openZoom(at, points = []) {
  if (Z.active) return;
  clearEndFeedback();
  cancelDrag(); hurry(); clearBookPointers(); clearZoomPointers();
  const session = ++Z.session, v = visible(); Z.ratio = v.reduce((n, i) => n + ratioOf(i), 0);
  Z.content.replaceChildren(...v.map((i) => {
    const img = new Image();
    img.src = file('small', i); img.alt = `Page ${i} of ${N}`; img.draggable = false;
    img.style.width = `${100 * ratioOf(i) / Z.ratio}%`;
    const hi = new Image(); hi.src = file('sharp', i);
    hi.decode().then(() => {
      if (Z.active && Z.session === session && img.isConnected) {
        hi.alt = img.alt; hi.draggable = false; hi.style.cssText = img.style.cssText; img.replaceWith(hi);
      }
    }).catch(() => { /* Keep the readable small page if full detail fails. */ });
    return img;
  }));
  clearTimeout(Z.closing); $('stage').inert = $('controls').inert = $('fullscreenControl').inert = true;
  Z.active = true; Z.el.hidden = false; zoomLayout(true);
  requestAnimationFrame(() => { if (Z.active && Z.session === session) Z.el.classList.add('open'); });
  if (at) { const box = Z.el.getBoundingClientRect(); zoomAt(2.5, at.x - box.left, at.y - box.top); }
  for (const p of points) { Z.el.setPointerCapture(p.pointerId); Z.pts.set(p.pointerId, zoomPoint(p)); }
  Z.last = zoomGesture(); $('zClose').focus();
}
function closeZoom() {
  if (!Z.active) return;
  Z.active = false; const session = ++Z.session; clearZoomPointers();
  Z.el.classList.remove('open'); Z.closing = setTimeout(() => { if (Z.session === session) { Z.el.hidden = true; Z.content.replaceChildren(); } }, 200);
  $('stage').inert = $('controls').inert = $('fullscreenControl').inert = false; $('zoomBtn').focus();
}
function zoomApply(animate) {
  const a = Z.area, w = Z.w * Z.s, h = Z.h * Z.s;
  Z.x = w <= a.w ? a.x + (a.w - w) / 2 : clamp(Z.x, a.x + a.w - w, a.x);
  Z.y = h <= a.h ? a.y + (a.h - h) / 2 : clamp(Z.y, a.y + a.h - h, a.y);
  Z.content.style.transition = animate && !reduceMotion ? 'transform .25s ease-out' : 'none';
  Z.content.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
}
function zoomAt(s, px, py, animate = true) {
  s = clamp(s, 1, 6);
  Z.x = px - (px - Z.x) * (s / Z.s); Z.y = py - (py - Z.y) * (s / Z.s); Z.s = s; zoomApply(animate);
}
const zoomPoint = e => { const b = Z.el.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
function zoomGesture() {
  const p = [...Z.pts.values()]; if (!p.length) return null;
  return { mx: p.reduce((a, q) => a + q.x, 0) / p.length, my: p.reduce((a, q) => a + q.y, 0) / p.length,
    d: p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0, n: p.length };
}
$('zClose').onclick = closeZoom;
$('zIn').onclick = () => zoomAt(Z.s * 1.6, Z.area.x + Z.area.w / 2, Z.area.y + Z.area.h / 2);
$('zOut').onclick = () => zoomAt(Z.s / 1.6, Z.area.x + Z.area.w / 2, Z.area.y + Z.area.h / 2);
Z.el.addEventListener('wheel', (e) => { if (!Z.active) return; e.preventDefault(); zoomSync(); const p = zoomPoint(e); zoomAt(Z.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)), p.x, p.y, false); }, { passive: false });
Z.el.addEventListener('pointerdown', (e) => {
  if (!Z.active || e.target.closest('button')) return;
  zoomSync(); zoomApply(); const p = zoomPoint(e);
  Z.el.setPointerCapture(e.pointerId); Z.pts.set(e.pointerId, p); Z.last = zoomGesture();
  if (Z.pts.size === 1 && e.timeStamp - Z.tapAt < 300) zoomAt(Z.s > 1.2 ? 1 : 2.5, p.x, p.y);
  Z.tapAt = Z.pts.size === 1 ? e.timeStamp : 0; Z.tapPoint = p;
});
Z.el.addEventListener('pointermove', (e) => {
  if (!Z.active || !Z.pts.has(e.pointerId)) return;
  if (Z.content.style.transition !== 'none') zoomSync();
  const point = zoomPoint(e);
  if (Z.tapPoint && Math.hypot(point.x - Z.tapPoint.x, point.y - Z.tapPoint.y) > 8) Z.tapAt = 0;
  Z.pts.set(e.pointerId, point); const p = zoomGesture();
  if (Z.last && Z.last.n === p.n) {
    Z.x += p.mx - Z.last.mx; Z.y += p.my - Z.last.my;
    if (p.d && Z.last.d) zoomAt(Z.s * p.d / Z.last.d, p.mx, p.my, false); else zoomApply();
  }
  Z.last = p;
});
const zoomUp = (e) => {
  if (!Z.pts.delete(e.pointerId)) return;
  if (e.type !== 'pointerup') Z.tapAt = 0;
  Z.last = zoomGesture();
};
Z.el.addEventListener('pointerup', zoomUp); Z.el.addEventListener('pointercancel', zoomUp); Z.el.addEventListener('lostpointercapture', zoomUp);
new ResizeObserver(() => zoomLayout()).observe(Z.el);

// ======================= start =======================
function plain() {   // without WebGL2: the pages side by side, swiped
  clearEndFeedback();
  stopTurn(); G = null; atlasController.abort(); smallJob?.abort();
  sharpJobs.forEach((job) => job.controller.abort());
  const box = document.createElement('div'); box.className = 'plain';
  for (let i = 1; i <= N; i++) { const img = new Image(); img.src = file('small', i); img.alt = `Page ${i} of ${N}`; img.loading = i > 2 ? 'lazy' : 'eager'; box.append(img); }
  canvas.replaceWith(box); $('controls').hidden = true; document.body.classList.add('ready'); loadText();
}
if (!gl) plain();
else {
  initGL();
  // Runs after layout and before paint, so a resized stage is never shown stretched.
  new ResizeObserver(() => { if (G && !gl.isContextLost()) { relayout = false; layout(); render(); } else { relayout = true; draw(); } }).observe($('stage'));
  // Label/font reflow must not finish a held page or a just-started page jump. Measure it at rest.
  const labels = new ResizeObserver(() => { relayout = true; draw(); });
  for (const id of ['title', 'controls', 'count', 'jump']) labels.observe($(id));
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); clearEndFeedback(); stopTurn(); G = null; atlasController.abort(); smallJob?.abort(); sharpJobs.forEach((job) => job.controller.abort()); });
  canvas.addEventListener('webglcontextrestored', () => { initGL(); relayout = true; draw(); prefetch(); });
  draw();
}
</script>
